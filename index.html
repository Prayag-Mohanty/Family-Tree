<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Tree</title>
  <meta name="description" content="One connected family tree. Find anyone, see their parents and children, and edit as the family grows.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <!-- Canvas -->
  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <svg id="edges" class="edges" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="nodes"></div>
    </div>
  </div>

  <!-- Top bar -->
  <header class="topbar glass">
    <div class="brand"><span class="logo">🌳</span><span class="brand-text">Family Tree</span></div>
    <div class="search" id="searchBox">
      <svg class="search-ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Find anyone…  ( / )" autocomplete="off" spellcheck="false">
      <div id="searchResults" class="results glass-strong" role="listbox"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="addPersonBtn"><span class="plus">+</span><span class="lbl">Add person</span></button>
      <div class="menu-wrap">
        <button class="btn icon" id="menuBtn" aria-label="More">⋯</button>
        <div class="menu glass-strong" id="menu" hidden>
          <button data-menu="expand">Expand everyone</button>
          <button data-menu="collapse">Collapse everyone</button>
          <hr>
          <button data-menu="export">Export backup (JSON)</button>
          <label class="as-btn">Import backup<input type="file" id="importInput" accept="application/json,.json" hidden></label>
          <hr>
          <button data-menu="reset" class="danger-text">Reset to starter tree</button>
        </div>
      </div>
    </div>
  </header>

  <div id="banner" class="banner glass" hidden>
    <span>Names like “2nd Son” are placeholders. Click anyone to add their real name.</span>
    <button class="x" id="bannerClose" aria-label="Dismiss">✕</button>
  </div>

  <!-- Bottom HUD -->
  <div class="hud glass" id="stats"></div>
  <div class="zoombar glass">
    <button class="zbtn" id="zoomOut" aria-label="Zoom out">−</button>
    <span id="zoomLabel">100%</span>
    <button class="zbtn" id="zoomIn" aria-label="Zoom in">+</button>
    <span class="sep"></span>
    <button class="zbtn wide" id="fitBtn" title="Fit everyone on screen">Fit</button>
  </div>

  <!-- Detail panel -->
  <aside id="panel" class="panel glass-strong" aria-hidden="true">
    <button class="x close" id="panelClose" aria-label="Close">✕</button>
    <div id="panelBody"></div>
  </aside>

  <!-- Editor -->
  <dialog id="editDialog" class="glass-strong">
    <form id="editForm" method="dialog" autocomplete="off">
      <div class="dlg-head">
        <h2 id="editTitle">Add person</h2>
        <button type="button" class="x" id="editClose" aria-label="Close">✕</button>
      </div>
      <div class="photo-row">
        <div id="photoPreview" class="av xl"></div>
        <div class="photo-btns">
          <label class="btn small as-btn">Upload photo<input type="file" id="photoInput" accept="image/*" hidden></label>
          <button type="button" class="btn small ghost" id="photoRemove">Remove</button>
        </div>
      </div>
      <div class="grid2">
        <label class="f">Full name *<input name="fullName" required></label>
        <label class="f">Nickname / also known as<input name="nickname" placeholder="e.g. Bablu, Chhotu"></label>
        <label class="f">Gender
          <select name="gender">
            <option value="">—</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label class="f">Birth order among siblings<input name="order" type="number" min="1" max="30" placeholder="1 = eldest"></label>
        <label class="f">Birth year<input name="birthYear" type="number" min="1700" max="2100" placeholder="e.g. 1962"></label>
        <label class="f">Death year<input name="deathYear" type="number" min="1700" max="2100" placeholder="if passed away"></label>
        <label class="f">Lives in<input name="location" placeholder="City"></label>
        <label class="f">Phone<input name="phone" type="tel"></label>
      </div>
      <label class="check"><input type="checkbox" name="deceased"> Passed away</label>
      <label class="f">Notes
        <textarea name="notes" rows="3" placeholder="Occupation, where they live, anything that helps you remember them"></textarea>
      </label>
      <div class="f">Parents <span class="hint">(up to 2)</span><div class="picker" id="parentsPicker"></div></div>
      <div class="f">Spouse(s)<div class="picker" id="spousePicker"></div></div>
      <div class="dlg-actions">
        <button type="button" class="btn ghost" id="editCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast glass-strong" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
